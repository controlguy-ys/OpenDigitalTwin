name: robotsim

services:
  web:
    image: robotsim-web:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      runtime-gateway:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0755
      - /var/run:size=1m,uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  runtime-gateway:
    image: robotsim-runtime-gateway:local
    build:
      context: .
      dockerfile: middleware/Dockerfile
    environment:
      ROBOTSIM_RUNTIME_KIND: "docker"
      ROBOTSIM_GATEWAY_HOST: "0.0.0.0"
      ROBOTSIM_GATEWAY_HTTP_PORT: "8081"
      ROBOTSIM_OPCUA_ADVERTISE_HOST: "${ROBOTSIM_OPCUA_ADVERTISE_HOST:-127.0.0.1}"
      ROBOTSIM_OPCUA_ADVERTISE_PORT: "${ROBOTSIM_OPCUA_PORT:-4841}"
      ROBOTSIM_OPCUA_PORT: "${ROBOTSIM_OPCUA_PORT:-4841}"
    ports:
      - "${ROBOTSIM_OPCUA_PORT:-4841}:${ROBOTSIM_OPCUA_PORT:-4841}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
