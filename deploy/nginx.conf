server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location = /runtime/healthz {
    set $runtime_health_upstream http://runtime-gateway:8081/healthz;
    proxy_pass $runtime_health_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /runtime/readyz {
    set $runtime_ready_upstream http://runtime-gateway:8081/readyz;
    proxy_pass $runtime_ready_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /runtime/ {
    set $runtime_upstream http://runtime-gateway:8081;
    proxy_pass $runtime_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control 'no-cache';
  }
}
